<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-label="Arman Kadiwal — Python, Android and DevOps projects">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071024"/><stop offset="0.54" stop-color="#0c1230"/><stop offset="1" stop-color="#180a35"/></linearGradient>
 <linearGradient id="energy" x2="1" y2="0"><stop stop-color="#36f3dc"/><stop offset="0.55" stop-color="#6990ff"/><stop offset="1" stop-color="#e775ff"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#8055ef" stop-opacity=".29"/><stop offset="1" stop-color="#8055ef" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#7ca1dc" stroke-opacity=".09"/></pattern>
 <style>
 .dash {stroke-dasharray:12 16; animation: orbit 22s linear infinite;} .pulse {animation:pulse 4s ease-in-out infinite;} .twinkle {animation: twinkle 3s ease-in-out infinite alternate;} .beam{animation:beam 6s ease-in-out infinite alternate;}
 @keyframes orbit{from{stroke-dashoffset:0;}to{stroke-dashoffset:-340;}} @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}} @keyframes twinkle{from{opacity:.25}to{opacity:.98}} @keyframes beam{from{opacity:.2}to{opacity:.8}}
 @media (prefers-reduced-motion:reduce){.dash,.pulse,.twinkle,.beam{animation:none!important}}
 </style>
</defs>
<rect width="1200" height="350" rx="22" fill="url(#bg)"/><rect width="1200" height="350" rx="22" fill="url(#grid)"/>
<circle cx="996" cy="170" r="247" fill="url(#glow)"/>
<g opacity=".9" fill="none"><circle cx="1010" cy="174" r="88" stroke="#5c6f9d" stroke-opacity=".6" stroke-width="1"/><circle cx="1010" cy="174" r="119" stroke="url(#energy)" stroke-opacity=".75" stroke-width="2" class="dash"/><circle cx="1010" cy="174" r="148" stroke="#879eff" stroke-opacity=".4" stroke-dasharray="3 11"/><circle cx="1010" cy="174" r="60" stroke="#49e6e1" stroke-opacity=".25"/></g>
<g class="pulse"><path d="M949 174L989 134L1030 174L989 216Z" fill="#071a34" stroke="#5ee9e8" stroke-width="2"/><circle cx="989" cy="174" r="21" fill="none" stroke="#85a6ff" stroke-width="4"/><circle cx="989" cy="174" r="7" fill="#59f5e0"/></g>
<g fill="#8bf7ff"><circle cx="1114" cy="90" r="4" class="twinkle"/><circle cx="875" cy="232" r="3" class="twinkle"/><circle cx="1150" cy="245" r="2"/><circle cx="90" cy="42" r="2"/><circle cx="390" cy="280" r="2"/></g>
<path d="M70 50H377" stroke="url(#energy)" stroke-width="3" stroke-linecap="round"/>
<text x="72" y="94" font-family="Inter,Arial,sans-serif" font-weight="600" font-size="17" letter-spacing="5" fill="#70eddf">HELLO WORLD / DEVELOPER PORTFOLIO</text>
<text x="67" y="179" font-family="Inter,Arial,sans-serif" font-size="78" font-weight="800" letter-spacing="1" fill="#f6f7ff">ARMAN</text>
<text x="67" y="252" font-family="Inter,Arial,sans-serif" font-size="78" font-weight="800" letter-spacing="1" fill="url(#energy)">KADIWAL</text>
<text x="73" y="294" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500" fill="#b4c0e7">PYTHON  /  ANDROID  /  DEVOPS  /  BUILDING IN PUBLIC</text>
<path d="M70 318H794" stroke="url(#energy)" stroke-opacity=".5" stroke-width="2" class="beam"/>
</svg>