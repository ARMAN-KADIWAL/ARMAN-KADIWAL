name: Refresh contribution trail

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/contribution-trail.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write

concurrency:
  group: contribution-trail
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Draw the real contribution calendar
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#b37453&color_dots=#f8f3ea,#e6dacb,#bbcbb9,#80a58c,#3d614d
            dist/snake-dark.svg?palette=github-dark&color_snake=#d5a17d&color_dots=#101711,#24382e,#4c6d59,#769c80,#b0cfb3

      - name: Publish animated SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
